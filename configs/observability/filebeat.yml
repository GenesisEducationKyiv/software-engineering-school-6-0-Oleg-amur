filebeat.inputs:
  - type: filestream
    id: release-notifier-container-logs
    paths:
      - /var/lib/docker/containers/*/*.log
    parsers:
      - container: ~
    processors:
      - add_docker_metadata:
          host: unix:///var/run/docker.sock
      - drop_event:
          when:
            not:
              equals:
                container.name: release-notifier
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
          add_error_key: true
      - add_fields:
          target: service
          fields:
            name: release-notifier
      - drop_fields:
          fields:
            - agent
            - container
            - docker
            - ecs
            - host
            - input
            - log
            - stream
          ignore_missing: true

setup.ilm.enabled: false
setup.template.enabled: false

output.elasticsearch:
  hosts:
    - http://elasticsearch:9200
  index: release-notifier-logs-%{+yyyy.MM.dd}
