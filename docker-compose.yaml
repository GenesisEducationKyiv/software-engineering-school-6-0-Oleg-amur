services:

  postgresql:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: mailpit
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  release-notifier:
    build: .
    image: release-notifier:latest
    container_name: release-notifier
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      SERVER_HOST: ${SERVER_HOST}
      SERVER_PORT: ${SERVER_PORT}
      GRPC_PORT: ${GRPC_PORT}
      DATABASE_URL: ${DATABASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      FROM_EMAIL: ${FROM_EMAIL}
      BASE_URL: ${BASE_URL}
      SCAN_INTERVAL: ${SCAN_INTERVAL}
      GITHUB_TIMEOUT: ${GITHUB_TIMEOUT}
      GITHUB_URL: ${GITHUB_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN}

  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  elasticsearch-init:
    image: elasticsearch:8.15.3
    container_name: elasticsearch-init
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        curl -fsS -X DELETE "http://elasticsearch:9200/_index_template/release-notifier-logs" || true;
        curl -fsS -X DELETE "http://elasticsearch:9200/_template/release-notifier-logs" || true;
        curl -fsS -X PUT "http://elasticsearch:9200/_index_template/release-notifier-logs"
        -H "Content-Type: application/json"
        -d '{"index_patterns":["release-notifier-logs-*"],"priority":500,"template":{"mappings":{"dynamic":true,"properties":{"@timestamp":{"type":"date"},"level":{"type":"keyword"},"msg":{"type":"text","fields":{"keyword":{"type":"keyword","ignore_above":256}}},"service.name":{"type":"keyword"},"method":{"type":"keyword"},"route":{"type":"keyword"},"path":{"type":"keyword"},"status":{"type":"integer"},"duration_ms":{"type":"long"},"err":{"type":"text","fields":{"keyword":{"type":"keyword","ignore_above":256}}}}}}}'
        && curl -fsS -X PUT "http://elasticsearch:9200/release-notifier-logs-000001"
        -H "Content-Type: application/json"
        -d '{"aliases":{"release-notifier-logs":{"is_write_index":true}}}'
        || true

  kibana:
    image: kibana:8.15.3
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  kibana-init:
    image: elasticsearch:8.15.3
    container_name: kibana-init
    depends_on:
      kibana:
        condition: service_started
      elasticsearch-init:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - >
        until curl -fsS "http://kibana:5601/api/status" >/dev/null; do sleep 5; done;
        curl -fsS -X POST "http://kibana:5601/api/data_views/data_view"
        -H "Content-Type: application/json"
        -H "kbn-xsrf: true"
        -d '{"data_view":{"id":"release-notifier-logs","title":"release-notifier-logs-*","name":"release-notifier-logs","timeFieldName":"@timestamp"}}'
        -o /dev/null
        || true

  filebeat:
    image: elastic/filebeat:8.15.3
    container_name: filebeat
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
      release-notifier:
        condition: service_started
    command: ["--strict.perms=false"]
    volumes:
      - ./configs/observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    depends_on:
      release-notifier:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./configs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./configs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
