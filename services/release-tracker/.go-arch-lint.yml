version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\\/test\\/.*$"

components:
  cmd: { in: cmd/** }
  support:
    in:
      - internal/apperr
      - internal/config
      - internal/database
      - internal/observability
      - internal/worker
      - migrations
  api: { in: internal/api/** }
  adapters: { in: internal/adapters/** }
  domain: { in: internal/modules/releasetracker/domain }
  usecase: { in: internal/modules/releasetracker/usecase }
  persistence: { in: internal/modules/releasetracker/persistence/** }
  transport: { in: internal/modules/releasetracker/transport/** }

vendors:
  shared-contract-events: { in: github.com/GenesisEducationKyiv/software-engineering-school-6-0-Oleg-amur/shared/contracts/events }
  uuid: { in: github.com/google/uuid }

deps:
  cmd:
    mayDependOn:
      - support
      - api
      - adapters
      - domain
      - usecase
      - persistence
      - transport
    anyVendorDeps: true

  support:
    mayDependOn:
      - support
    anyVendorDeps: true

  api:
    mayDependOn:
      - support
      - transport
      - usecase
    anyVendorDeps: true

  adapters:
    mayDependOn:
      - support
      - domain
    anyVendorDeps: true

  domain:
    mayDependOn:
      - domain

  usecase:
    mayDependOn:
      - support
      - domain
    canUse:
      - shared-contract-events
      - uuid

  persistence:
    mayDependOn:
      - support
      - domain
    anyVendorDeps: true

  transport:
    mayDependOn:
      - support
      - domain
      - usecase
    anyVendorDeps: true
