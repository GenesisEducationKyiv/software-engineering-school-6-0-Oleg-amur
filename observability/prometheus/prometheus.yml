global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: subscription-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - subscription-service:8080

  - job_name: release-tracker
    metrics_path: /metrics
    static_configs:
      - targets:
          - release-tracker:8081
