filebeat.inputs:
  - type: filestream
    id: subscription-service-container-logs
    paths:
      - /var/lib/docker/containers/*/*.log
    parsers:
      - container: ~
    processors:
      - add_docker_metadata:
          host: unix:///var/run/docker.sock
      - drop_event:
          when:
            not:
              or:
                - equals:
                    container.labels.com_docker_compose_service: subscription-service
                - equals:
                    container.labels.com.docker.compose.service: subscription-service
                - regexp:
                    container.name: ".*subscription-service.*"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
          add_error_key: true
      - timestamp:
          field: time
          target_field: "@timestamp"
          layouts:
            - "2006-01-02T15:04:05.999999999Z07:00"
          ignore_missing: true
          ignore_failure: true
      - add_fields:
          target: service
          fields:
            name: subscription-service
      - drop_fields:
          fields:
            - agent
            - container
            - docker
            - ecs
            - host
            - input
            - log
            - stream
          ignore_missing: true

output.elasticsearch:
  hosts:
    - http://elasticsearch:9200
