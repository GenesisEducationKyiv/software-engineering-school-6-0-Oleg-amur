name: CI/CD workflow

on: 
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.3
          cache: true

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.3
          cache: true

      - name: unit tests
        run: go test -v ./...

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.3
          cache: true

      - name: integration tests
        run: go test -tags=integration -v ./test/integration/...

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: e2e tests
        run: docker compose -f test/e2e/docker-compose-e2e-tests.yaml up --build --abort-on-container-exit --exit-code-from playwright

      - name: cleanup e2e containers
        if: always()
        run: docker compose -f test/e2e/docker-compose-e2e-tests.yaml down -v --remove-orphans

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - integration-tests
      - e2e-tests
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build image
        run: docker build -t release-notifier .
