name: CI/CD workflow

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.3
          cache: true

      - name: lint shared contracts
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          args: ./shared/contracts/...

      - name: lint release notifier
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          args: ./services/release-notifier/...

      - name: lint notification worker
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          args: ./services/notification-worker/...

      - name: lint e2e fake github
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          args: ./test/e2e/fakes/github/...

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.3
          cache: true

      - name: unit tests
        run: make coverage-unit

      - name: upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit-*.out

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.3
          cache: true

      - name: integration tests
        run: make coverage-integration

      - name: upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: coverage/integration.out

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: e2e tests
        run: make test-e2e

      - name: cleanup e2e containers
        if: always()
        run: docker compose -f test/e2e/docker-compose-e2e-tests.yaml down -v --remove-orphans

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - integration-tests
      - e2e-tests
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build release notifier image
        run: docker build -f services/release-notifier/Dockerfile -t release-notifier .

      - name: build notification worker image
        run: docker build -f services/notification-worker/Dockerfile -t notification-worker .
