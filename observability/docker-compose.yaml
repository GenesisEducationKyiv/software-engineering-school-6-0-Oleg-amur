services:
  elasticsearch:
    image: elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: kibana:8.15.3
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  kibana-init:
    image: curlimages/curl:8.6.0
    entrypoint: ["/bin/sh"]
    depends_on:
      kibana:
        condition: service_started
    environment:
      KIBANA_URL: http://kibana:5601
    command: ["/usr/local/bin/init-kibana.sh"]
    volumes:
      - ./observability/kibana/init.sh:/usr/local/bin/init-kibana.sh:ro
      - ./observability/kibana/release-notifier-logs.ndjson:/usr/local/share/kibana/release-notifier-logs.ndjson:ro

  filebeat:
    image: elastic/filebeat:8.15.3
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
      release-notifier:
        condition: service_started
    command: ["--strict.perms=false"]
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      release-notifier:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
