database:
  connectionString: "postgres://postgres:postgres@localhost:5433/release_tracker?sslmode=disable"
server:
  host: "0.0.0.0"
  port: "8081"
scanner:
  interval: "1m"
subscriptions:
  url: "http://localhost:8080"
  grpcAddress: "localhost:50051"
  timeout: "10s"
eventBus:
  url: "amqp://guest:guest@localhost:5672/"
  notificationExchange: "notifications"
  notificationQueue: "notification-worker"
  notificationDLQ: "notification-worker.dlq"
github:
  url: "https://api.github.com"
  apiToken: ""
  timeout: "10s"
